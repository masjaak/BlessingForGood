name: Temporary refresh R2 package lock

on:
  push:
    branches:
      - fix/public-media-upload-efficiency-20261007

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, 'Refresh R2 package lock') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-media-upload-efficiency-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh R2 package lock"
          git push origin HEAD:fix/public-media-upload-efficiency-20261007
