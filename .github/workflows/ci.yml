name: BFG Random PO finance gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --check src/app/admin/random-po/page.tsx src/features/manual-po/manual-po.tsx src/app/globals.css tests/components/random-po-finance.test.tsx
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run convex/randomPoFinance.test.ts convex/manualPoEntries.test.ts convex/paymentConfirmations.test.ts tests/components/random-po-finance.test.tsx tests/components/admin-random-po-queue.test.tsx --silent
