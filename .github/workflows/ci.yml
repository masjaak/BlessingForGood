name: BFG finance gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --check convex/invoiceReminders.ts convex/invoiceReminders.test.ts "src/app/admin/invoices/[invoiceId]/page.tsx" "src/app/account/invoices/[invoiceId]/page.tsx" tests/components/invoice-settlement-reminder.test.tsx src/app/admin/random-po/page.tsx src/features/manual-po/manual-po.tsx tests/components/random-po-finance.test.tsx
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run convex/invoiceReminders.test.ts convex/invoices.test.ts convex/paymentConfirmations.test.ts convex/randomPoFinance.test.ts tests/components/invoice-settlement-reminder.test.tsx tests/components/admin-random-po-queue.test.tsx tests/components/random-po-finance.test.tsx --silent
