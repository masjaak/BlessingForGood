name: Temporary public upload regression validation

on:
  push:
    branches:
      - fix/direct-r2-public-media-upload-20261008

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run tests/lib/upload-file.test.ts convex/product-media.test.ts
      - run: npx eslint src/lib/upload-file.ts src/features/admin-books/media/admin-book-media.tsx src/features/ready-stock/admin-listing-editor.tsx convex/books.ts tests/lib/upload-file.test.ts
