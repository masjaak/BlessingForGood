name: tmp-client-redline-ci

on:
  push:
    branches:
      - fix/ready-stock-description-invoice-copy

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run convex/readyStock-standalone.test.ts tests/components/admin-ready-stock.test.tsx tests/components/ready-stock-detail.test.tsx tests/components/customer-invoices.test.tsx
      - run: npm run build
      - run: git diff --check
