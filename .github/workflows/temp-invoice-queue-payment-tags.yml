name: Temporary invoice queue payment tag validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run convex/invoices.test.ts convex/deposit.test.ts
      - run: npx prettier --check convex/invoices.ts convex/invoices.test.ts src/app/admin/invoices/page.tsx src/app/globals.css
      - run: npx eslint convex/invoices.ts convex/invoices.test.ts src/app/admin/invoices/page.tsx
