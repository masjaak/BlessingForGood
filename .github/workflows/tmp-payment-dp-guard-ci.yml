name: tmp-payment-dp-guard-ci

on:
  push:
    branches:
      - fix/payment-dp-minimum-guard

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run convex/paymentConfirmations.test.ts convex/invoices.test.ts convex/deposit.test.ts tests/lib/errors.test.ts tests/components/customer-invoices.test.tsx
      - run: npm run build
      - run: git diff --check
