name: Temporary R2 media verification
on:
  push:
    branches:
      - fix/r2-media-preview-20261008
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Format and push touched files if needed
        run: |
          npx prettier --write src/components/book-cover.tsx convex/lib/publicMedia.ts tests/components/book-cover-r2.test.tsx convex/lib/publicMedia.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/book-cover.tsx convex/lib/publicMedia.ts tests/components/book-cover-r2.test.tsx convex/lib/publicMedia.test.ts
            git commit -m "Format R2 media delivery patch"
            git push
          fi
      - run: npm run typecheck
      - run: npx vitest run tests/components/book-cover-r2.test.tsx convex/lib/publicMedia.test.ts tests/components/cover-upload-field.test.tsx
      - run: npx eslint src/components/book-cover.tsx convex/lib/publicMedia.ts tests/components/book-cover-r2.test.tsx convex/lib/publicMedia.test.ts
      - run: npx prettier --check src/components/book-cover.tsx convex/lib/publicMedia.ts tests/components/book-cover-r2.test.tsx convex/lib/publicMedia.test.ts
