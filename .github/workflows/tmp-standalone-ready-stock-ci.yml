name: tmp-standalone-ready-stock-ci

on:
  push:
    branches:
      - feat/manual-ready-stock-standalone

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx convex deployment select local
      - run: npx convex dev --once --typecheck enable --codegen enable
      - run: npx vitest run convex/readyStock-standalone.test.ts convex/readyStock.test.ts convex/readyStock-price-override.test.ts tests/components/admin-ready-stock.test.tsx tests/components/ready-stock-catalog.test.tsx tests/components/ready-stock-detail.test.tsx tests/components/customer-ready-stock-orders.test.tsx tests/components/customer-invoices.test.tsx
      - run: npm run build
      - run: git diff --check
