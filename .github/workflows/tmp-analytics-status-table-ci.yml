name: tmp-analytics-status-table-ci

on:
  push:
    branches:
      - fix/analytics-status-table-mobile

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run tests/components/admin-analytics.test.tsx
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/admin-analytics-responsive.spec.ts --project=chromium
      - run: npm run build
      - run: git diff --check
