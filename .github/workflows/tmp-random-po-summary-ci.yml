name: tmp-random-po-summary-ci

on:
  push:
    branches:
      - fix/random-po-summary-card-hierarchy

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run tests/components/admin-random-po-queue.test.tsx
