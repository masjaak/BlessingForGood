name: Temporary format public media files

on:
  push:
    branches:
      - fix/public-media-upload-efficiency-20261007

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Format public media files') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-media-upload-efficiency-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write convex/lib/publicMedia.ts convex/books.ts convex/readyStockListings.ts convex/lib/catalogView.ts convex/readyStock.ts tests/lib/upload-file.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- convex/lib/publicMedia.ts convex/books.ts convex/readyStockListings.ts convex/lib/catalogView.ts convex/readyStock.ts tests/lib/upload-file.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/lib/publicMedia.ts convex/books.ts convex/readyStockListings.ts convex/lib/catalogView.ts convex/readyStock.ts tests/lib/upload-file.test.ts
          git commit -m "Format public media files"
          git push origin HEAD:fix/public-media-upload-efficiency-20261007
