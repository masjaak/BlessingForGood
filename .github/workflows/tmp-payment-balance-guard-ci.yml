name: tmp-payment-balance-guard-ci

on:
  push:
    branches:
      - fix/payment-review-balance-guard

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run convex/paymentConfirmations.test.ts tests/components/admin-payments.test.tsx tests/components/customer-payment-guard.test.tsx tests/components/customer-invoices.test.tsx tests/components/admin-invoices.test.tsx
      - run: npm run build
      - run: git diff --check
