name: tmp-customer-invoice-context-ci

on:
  push:
    branches:
      - fix/customer-invoice-context-header

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run convex/invoices.test.ts tests/components/customer-invoices.test.tsx tests/lib/customer-invoice-context.test.ts
      - run: npm run build
      - run: git diff --check
