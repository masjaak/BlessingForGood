name: Temporary deposit allocation validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/deposit-allocation-control-20261002

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run convex/deposit.test.ts tests/components/customer-payment-guard.test.tsx
      - name: Show Prettier diff
        run: |
          npx prettier --write convex/invoiceDepositAllocations.ts convex/deposit.test.ts src/app/account/invoices/[invoiceId]/page.tsx src/app/admin/deposits/page.tsx src/app/admin/invoices/[invoiceId]/page.tsx tests/components/customer-payment-guard.test.tsx
          git diff -- convex/invoiceDepositAllocations.ts convex/deposit.test.ts src/app/account/invoices/[invoiceId]/page.tsx src/app/admin/deposits/page.tsx src/app/admin/invoices/[invoiceId]/page.tsx tests/components/customer-payment-guard.test.tsx
          exit 1
      - run: npx eslint convex/invoiceDepositAllocations.ts convex/deposit.test.ts src/app/account/invoices/[invoiceId]/page.tsx src/app/admin/deposits/page.tsx src/app/admin/invoices/[invoiceId]/page.tsx tests/components/customer-payment-guard.test.tsx
