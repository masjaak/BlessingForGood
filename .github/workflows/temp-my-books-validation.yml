name: Temporary Buku Saya verification
on:
  push:
    branches:
      - fix/my-books-section-error-isolation-20261008
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run tests/components/customer-my-books.test.tsx
      - run: npx eslint src/components/my-books-section-boundary.tsx src/app/account/orders/page.tsx tests/components/customer-my-books.test.tsx
      - run: npx prettier --check src/components/my-books-section-boundary.tsx src/app/account/orders/page.tsx tests/components/customer-my-books.test.tsx
