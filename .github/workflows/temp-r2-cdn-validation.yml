name: Temporary R2 CDN validation
on:
  push:
    branches:
      - fix/bfg-media-r2-production-domain-20261008
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run convex/lib/publicMedia.test.ts convex/product-media.test.ts tests/components/admin-book-media-characterization.test.tsx
      - run: npx eslint convex/lib/publicMedia.test.ts
      - run: npx prettier --check convex/lib/publicMedia.test.ts
      - run: sh -n scripts/vercel-build.sh
